; picket-forest replay benchmark (feature 007, research R9).
; The sketch in ../esp8266/picket_forest_bench replays CAN frames from flash through the whole
; detection chain and prints one PICKET_FOREST_RESULT line. Its src/ folder (detector sources,
; exported headers, synthetic test vectors) is generated by `uv run security can-ids measure`
; and is gitignored.
;
;   uv run security can-ids measure --target esp32-qemu        # build esp32, run in QEMU
;   uv run security can-ids measure --target esp8266 -b BOARD  # build, flash, read over serial

[platformio]
src_dir = ../esp8266/picket_forest_bench
build_dir = ../../../build/picket-forest/pio

[env]
framework = arduino
monitor_speed = 115200
build_flags = -ffp-contract=off
extra_scripts = post:../../bench/scripts/hil_manifest.py

[env:esp32]
platform = espressif32
board = esp32dev
upload_speed = 115200  ; reliable on CH9102 dev boards (921600 failed to connect)
build_flags = ${env.build_flags} -DPF_TARGET=\"esp32\"

[env:esp8266]
platform = espressif8266
board = d1_mini
board_build.f_cpu = 160000000L
build_flags = ${env.build_flags} -DPF_TARGET=\"esp8266\"

[env:mkrzero]
; Arduino MKR Zero: SAMD21 Cortex-M0+ at 48 MHz, no FPU, 32 KB RAM (fewer test vectors, see measure.py)
platform = atmelsam
board = mkrzero
build_flags = ${env.build_flags} -DPF_TARGET=\"samd21\" -Wl,-u,_printf_float
