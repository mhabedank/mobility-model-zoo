version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "click"
version = "8.1.7"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "esp-pylib"
version = "1.0.0"
source = { registry = "https://pypi.org/simple" }

[package.optional-dependencies]
cli = [
    { name = "click" },
]

[[package]]
name = "esptool"
version = "4.8.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "esp-pylib", extra = ["cli"] },
]

[[package]]
name = "mobility-model-zoo"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "numpy" },
]

[package.optional-dependencies]
edge = [
    { name = "esptool" },
]
edge-hw = [
    { name = "platformio" },
]
jtbd = [
    { name = "torch" },
    { name = "transformers" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[[package]]
name = "numpy"
version = "2.1.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "platformio"
version = "6.1.16"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pytest"
version = "8.3.3"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "torch"
version = "2.5.0"
source = { registry = "https://download.pytorch.org/whl/cpu" }

[[package]]
name = "transformers"
version = "4.46.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "numpy" },
]
