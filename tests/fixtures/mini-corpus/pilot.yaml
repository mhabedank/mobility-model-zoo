# Mini corpus fixture: 5 chunks, mocked backends. test_fixture allows freezing mock runs.
root: .
benchmark_version: mini-v1
test_fixture: true
paths:
  guideline: guideline.md
  examples: examples
  domain: domain.yaml
  models: models.yaml
  criteria: decision-criteria.yaml
  teacher_scoring: teacher-scoring.yaml
  budget: budget.yaml
  data: store
  benchmarks: benchmarks
  reports: reports
  mock: mock
pilot:
  composition:
    main_size: [5, 5]
    holdout_size: [0, 0]
    sub_area_share_of_relevant: [0.0, 1.0]
    source_type_share: [0.0, 1.0]
    irrelevant_or_near_miss_share: [0.0, 1.0]
    non_eu_share: [0.0, 1.0]
    dach_largest_region: false
    language_min_share: 0.35
    token_range: [10, 1500]
  substitutions: []
  holdout_size: 0
  min_iou: 0.3
  bootstrap_resamples: 200
  bootstrap_seed: 7
  underpowered_min_units: 30
  max_retries: 0
  max_output_tokens: 4096
  assumed_output_tokens: 500
  consistency_rules: [irrelevant_no_items, enum_values, quantified_has_quantity]
  redaction_patterns_version: redact-v1
