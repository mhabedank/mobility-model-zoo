teacher_task_en: Find the jobs, pains and gains in the text (fixture).
kind:
  drafted_by: claude
  approval: fixture owner
  job: What an actor wants to get done (fixture).
  pain: What bothers the actor (fixture).
  gain: What the actor wants (fixture).
mode:
  values:
  - walk
  - bicycle
  - micromobility
  - motorcycle
  - car
  - taxi_ridehailing
  - bus
  - tram_metro
  - train
  - coach
  - public_transport
  - truck_van
  - air
  - water
  - other
improve:
  values:
  - time
  - cost
  - effort
  - reliability
  - safety
  - comfort
  - access
  - information
  - flexibility
  - environment
  - other
pass_instructions:
  drafted_by: claude
  approval: fixture owner
  pass1: 'Fixture pass 1: return the items.'
  pass2: 'Fixture pass 2: return the attributes of the given items.'
  pass3: 'Fixture pass 3: return the links between the given items.'
pilot_thresholds:
  status: provisional
  owner_choice: Freigeben (vorläufig)
  drafted_by: claude
  approval: owner, 2026-11-28, in chat (content approval after Fable review 2; hash
    approval of the assembled package pending)
  per:
  - field
  - language
  definitions:
    matching: Items of two references are matched one to one when the token IoU of
      their quotes is at least 0.5, after stripping punctuation at the edges; pairs
      with the highest IoU are matched first. Tokens are split at white space.
    item_matching: F1 of matched items. The F1 at any overlap is reported next to
      it and not used for the decision.
    relevance: Cohen's kappa over all chunks of the pilot. Raw agreement and a prevalence-robust
      coefficient (Gwet's AC1) are reported next to it.
    attributes: Cohen's kappa on items matched by both references, for kind, actor_type,
      evidence_scope and states_solution; job_kind only on matched items that both
      references call job. evidence_type uses a weighted kappa with linear weights.
    lists: 'mode and improve: Krippendorff''s alpha with the MASI set distance on
      matched items; both empty counts as agreement. For improve, a kappa per value
      is reported to find values to merge.'
    pointers: 'executor_role and situation: two numbers each, on matched items. A
      kappa of filled against empty, and a token F1 on items that both references
      filled, comparing the pointed strings, not their offsets.'
    links: 'Scored only on pairs of items that both references matched: F1 of the
      links between matched items. The end-to-end F1 is reported next to it and not
      used for the decision. For order, the relation (before or during) is reported
      as a separate kappa on links both references found. Two links agree when both
      ends are matched items, the direction is the same and the relation is the same.'
    link_sample: 'Links are scored on the random pilot plus an enriched sub-sample
      of 100 chunks per language: chunks in which code finds a word of link_connectives.
      If a link type has fewer than 30 units, the sub-sample is extended once, to
      200 chunks per language. Link prevalence is never estimated from the enriched
      sub-sample.'
    intervals: 95 % bootstrap intervals, resampling chunks.
    units: Items or links that at least one reference filled, counted per field and
      language.
    pilot_size: 100 chunks per language drawn at random, plus the enriched link sub-sample
      (100 chunks per language, at most 200).
    revision: After a guideline revision, fields are scored again on a fresh holdout
      of the same size as the pilot, not on the pilot chunks.
  thresholds:
    core:
      relevance_kappa:
        threshold: 0.75
        floor: 0.6
      item_matching_f1:
        threshold: 0.6
        floor: 0.45
      kind_kappa:
        threshold: 0.6
        floor: 0.4
      actor_type_kappa:
        threshold: 0.6
        floor: 0.4
      evidence_scope_kappa:
        threshold: 0.6
        floor: 0.4
      evidence_type_weighted_kappa:
        threshold: 0.5
        floor: 0.4
    attributes:
      job_kind_kappa:
        threshold: 0.5
        floor: 0.4
        on_fail: collapse to functional against other and score again before dropping
      mode_masi_alpha:
        threshold: 0.7
        floor: 0.4
      improve_masi_alpha:
        threshold: 0.5
        floor: 0.35
      states_solution_kappa:
        threshold: 0.5
        floor: 0.4
      states_solution_true_f1:
        threshold: 0.6
        floor: 0.4
        min_true_items: 30
    pointers:
      executor_role_filled_kappa:
        threshold: 0.6
        floor: 0.4
      executor_role_token_f1:
        threshold: 0.6
        floor: 0.4
      situation_filled_kappa:
        threshold: 0.6
        floor: 0.4
      situation_token_f1:
        threshold: 0.6
        floor: 0.4
    links:
      actor_pair_f1:
        threshold: 0.5
        floor: 0.3
      means_end_f1:
        threshold: 0.5
        floor: 0.3
      order_f1:
        threshold: 0.5
        floor: 0.3
  reported_only:
  - relevance raw agreement and Gwet's AC1
  - evidence_scope Gwet's AC1
  - item F1 at any overlap
  - end-to-end F1 of each link field
  - order relation kappa
  - improve kappa per value
  - actor_type per class, with society marked as underpowered
  decision: 'A field is produced when its estimate meets the threshold and the lower
    bound of its interval meets the floor; a field with two numbers needs both. First
    count the units: with fewer than 30 the field is underpowered whatever its estimate,
    and the sample is extended once, to at most twice its size; a field that is still
    underpowered is not produced in this version and is listed as not measured. With
    30 or more units: an estimate below the floor means not produced; an estimate
    between floor and threshold gets one guideline revision and is scored again on
    a fresh holdout of the same size as the pilot, and is then produced only if it
    meets this rule; an estimate at the threshold with a lower bound below the floor
    is extended once in the same way.'
  keep_always_stop: A keep_always field that would be not produced under the decision
    rule, at any step, stops the pilot in that language, and the guideline goes back
    to the owner. It is never dropped. relevance_kappa stands for relevant and item_matching_f1
    for quote.
  per_language: Each field is decided per language and is produced only in the languages
    where it passed.
link_connectives:
  drafted_by: claude
  approval: owner, 2026-11-28, in chat (content approval after Fable review 2; hash
    approval of the assembled package pending)
  rule: A closed list that code uses only to draw the enriched link sub-sample of
    the agreement pilot. It does not decide whether pass 3 runs, and it does not decide
    a link.
  means_end:
  - um … zu
  - damit
  - deshalb
  - dafür
  - in order to
  - so that
  order:
  - zuerst
  - danach
  - bevor
  - nachdem
  - während
  - first
  - afterwards
  - before
  - after
  - while
  actor_pair:
  - weil
  - wegen
  - because
  - because of
  actor_pair_condition: together with at least two different role words in the chunk
