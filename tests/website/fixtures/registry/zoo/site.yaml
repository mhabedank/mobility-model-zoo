# Site-wide settings of the zoo website (feature 008). Schema:
# src/mobility_model_zoo/site/schemas/site-config.schema.json. Model texts live in
# zoo/models/<name>/site.yaml; model facts come from the release records.
title: Mobility Model Zoo
canonical_url: https://mhabedank.github.io/mobility-model-zoo/
tagline: Small models for mobility. Measured, not claimed.
lead: >-
  An open, non-commercial collection of small, fast machine learning models for mobility, from
  product development to vehicles and embedded systems. Every model runs locally, is measured on a
  frozen benchmark and is published with a model card that says how good it is, against what, how
  fast on which hardware, and where it fails.
values:
  - title: Runs where your data is
    text: From a laptop down to a microcontroller. No hosted API at runtime, no cost per call.
  - title: Measured on frozen data
    text: Every model is scored on a frozen benchmark with a fixed harness, and every number names what it is measured against.
  - title: Published with a model card
    text: Quality, speed on named hardware, known failure modes and the provenance of the training data, for every version.
principles:
  - title: Measured, not claimed
    text: Every model is scored on a frozen benchmark with a fixed harness, and the card reports quality, speed on named hardware and known failure modes.
  - title: Immutable versions
    text: Each release is one tagged version and is never overwritten. Older versions stay available; a broken version is marked deprecated.
  - title: Open method, closed data
    text: Models, methods, prompts and evaluation results are published. Datasets and source texts are not, because they contain text written by people who did not agree to its redistribution.
  - title: Compliance
    text: Sources and their licences are credited for every release. The privacy notice says how texts are collected and processed and how to object.
legal:
  imprint: https://miskatonic-analytics.com/imprint.html
  privacy: https://github.com/mhabedank/mobility-model-zoo/blob/main/PRIVACY.md
  copyright: https://github.com/mhabedank/mobility-model-zoo/blob/main/COPYRIGHT_POLICY.md
repo: https://github.com/mhabedank/mobility-model-zoo
hf_org: https://huggingface.co/mobility-model-zoo
