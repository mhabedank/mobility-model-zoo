repos:
  public: mobility-model-zoo/sandbox-pipeline-tiny
  staging: mobility-model-zoo/sandbox-pipeline-tiny-staging
card:
  intended_use: Testing the release pipeline of the mobility model zoo.
  out_of_scope: Any real use. The model has random weights and its outputs mean nothing.
  input_output: "Input: a text. Output: JSON with one item per sentence (`kind`, `quote`, `score`)."
  install: pip install "mobility-model-zoo @ git+https://github.com/mhabedank/mobility-model-zoo@<tag>"
  how_to_run: |
    import json

    from mobility_model_zoo.sandbox.model import PipelineTestModel

    model = PipelineTestModel.from_pretrained("{repo_id}", revision="{revision}")
    print(json.dumps(model.predict({text}), ensure_ascii=False, indent=2))
  limitations: Random weights. The outputs are deterministic but meaningless.
  citation: |
    @misc{mobility-model-zoo,
      title  = {mobility-model-zoo},
      author = {Habedank, Martin},
      year   = {2026},
      url    = {https://huggingface.co/mobility-model-zoo}
    }
