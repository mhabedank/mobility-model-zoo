[project]
name = "jtbd-pilot"
version = "0.1.0"
description = "Pilot for JTBD extraction: frontier agreement, zero-shot baselines and go/revise/rethink decision"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "openai>=1.40",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "trafilatura>=1.12",
    "pypdf>=4.3",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "python-dotenv>=1.0",
]

[project.scripts]
pilot = "jtbd_pilot.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jtbd_pilot"]

[tool.ruff]
line-length = 105
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# typer declares options as call defaults
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
