# (specs/005-topic-layout-security-merge/contracts/path-map.md, section B). Directories end in "/".
renames:
  - {from: README.md, to: topics/security/README.md}
  - {from: docs/roadmap.md, to: topics/security/roadmap.md}
  - {from: docs/research/README.md, to: topics/security/research/README.md}
  - {from: docs/research/01-bedrohungslandschaft.md, to: topics/security/research/01-threat-landscape.md}
  - {from: docs/research/02-literatur.md, to: topics/security/research/02-literature.md}
  - {from: docs/research/03-datensaetze.md, to: topics/security/research/03-datasets.md}
  - {from: docs/research/04-hardware.md, to: topics/security/research/04-hardware.md}
  - {from: docs/research/05-toolchain-und-publishing.md, to: topics/security/research/05-toolchain-and-publishing.md}
  - {from: docs/research/notes/, to: topics/security/research/notes/}
  - {from: src/msml/can/features.py, to: src/mobility_model_zoo/security/can_ids/forest_features.py}
  - {from: src/msml/datasets/can_train_and_test.py, to: src/mobility_model_zoo/security/can_ids/can_train_and_test.py}
  - {from: src/msml/eval/metrics.py, to: src/mobility_model_zoo/security/can_ids/metrics.py}
  - {from: models/can-ids-tiny/pipeline.py, to: src/mobility_model_zoo/security/can_ids/forest.py}
  - {from: models/can-ids-tiny/MODEL_CARD.md, to: topics/security/reports/picket-forest/research-card.md}
  - {from: models/can-ids-tiny/README.md, to: topics/security/recipes/picket-forest.md}
  - {from: models/can-ids-tiny/results/config.json, to: topics/security/reports/picket-forest/config.json}
  - {from: models/can-ids-tiny/results/protocol_results.json, to: topics/security/reports/picket-forest/protocol_results.json}
  - {from: models/can-ids-tiny/results/benchmarks/, to: topics/security/reports/picket-forest/benchmarks/}
  - {from: models/can-ids-tiny/c/can_ids_tiny.c, to: firmware/picket-forest/c/can_ids_tiny.c}
  - {from: models/can-ids-tiny/c/can_ids_tiny.h, to: firmware/picket-forest/c/can_ids_tiny.h}
  - {from: models/can-ids-tiny/c/host_score.c, to: firmware/picket-forest/c/host_score.c}
  - {from: models/can-ids-tiny/c/generated/can_ids_tiny_config.h, to: firmware/picket-forest/c/generated/can_ids_tiny_config.h}
  - {from: models/can-ids-tiny/firmware/, to: firmware/picket-forest/esp-idf/}
  - {from: models/can-ids-tiny/firmware-esp8266/, to: firmware/picket-forest/esp8266/}
  - {from: models/can-ids-tiny/prebuilt/README.md, to: firmware/picket-forest/README.md}
  - {from: firmware/components/msml_can_features/, to: firmware/components/can_features/}
  - {from: scripts/setup-cloud.sh, to: scripts/setup-cloud.sh}
  - {from: tests/test_can_features.py, to: tests/security/can_ids/test_forest_features.py}
  - {from: tests/test_metrics.py, to: tests/security/can_ids/test_metrics.py}
strip:
  - {glob: models/can-ids-tiny/c/generated/test_vectors.h, reason: embeds 4000 raw frames of can-train-and-test; datasets are not published from git}
  - {glob: models/can-ids-tiny/c/generated/can_ids_tiny_model.h, reason: generated by emlearn (2.6 MB); rebuilt by `security can-ids forest convert`}
  - {glob: models/can-ids-tiny/prebuilt/*.bin, reason: firmware images embed the raw test frames; rebuilt from source}
  - {glob: models/can-ids-tiny/results/model.joblib, reason: trained weights (pickle); a release artefact for staging, rebuilt by retraining}
  - {glob: models/can-ids-tiny/results/logs/*, reason: run logs; regenerated}
  - {glob: tmp/*, reason: emlearn scratch files}
drop:
  - {glob: models/can-ids-tiny/publish.py, reason: separate Hugging Face upload; releases go through the zoo pipeline only}
  - {glob: .github/workflows/*, reason: replaced by the zoo workflows (ci.yml, firmware.yml)}
  - {glob: .gitignore, reason: the zoo .gitignore applies}
  - {glob: LICENSE, reason: same Apache-2.0 licence as the zoo}
  - {glob: pyproject.toml, reason: dependencies merged by hand into the zoo pyproject}
  - {glob: uv.lock, reason: the zoo lockfile applies}
  - {glob: src/msml/__init__.py, reason: replaced by zoo package __init__ files}
  - {glob: src/msml/*/__init__.py, reason: replaced by zoo package __init__ files}
