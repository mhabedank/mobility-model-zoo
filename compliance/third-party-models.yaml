# Third-party models: base models, encoders and classifiers a zoo model or a pipeline stage loads
# (constitution 2.1.0, Principle VI; feature 011, research R8). Schema:
# src/mobility_model_zoo/compliance/schemas/third-party-models.schema.json.
# Each model is pinned to a revision, and remote code it loads to its own commit. The restriction is
# derived, not stored: the weights licence combined with the licences of the training data its model
# card names; where the training data is more restrictive than the weights, the training data
# governs. A training-data licence `unknown` is check C-X2 once the model is used (used_by not
# empty), unless an owner decision in compliance/decisions.yaml lists the record id.
# Training data as named on each model card, read on 2026-10-10.
models:
- id: FacebookAI/xlm-roberta-large
  revision: c23d21b0620b635a76227c604d44e43a9f0ee389
  remote_code: null
  weights_licence: MIT
  training_data_named: true
  training_data:
  - {name: "CC-100 (filtered CommonCrawl, 100 languages)", url: "https://data.statmt.org/cc-100/", licence: LicenseRef-CommonCrawl-ToU}
  used_by:
  - {kind: base_model, ref: scout-large}
  - {kind: stage, ref: "configs/productdev/jtbd/span-xlmr.yaml#base_encoder"}
  notes: Base model of scout-large. Common Crawl terms grant a limited access licence without non-commercial or share-alike terms.
  owner: Martin Habedank
  last_reviewed: '2026-10-10'
  next_review: '2027-04-10'
