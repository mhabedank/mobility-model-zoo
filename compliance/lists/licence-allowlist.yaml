# The project's licence list (constitution 2.1.0, Principle VI; feature 011, research R2).
# Every licence an input of a model may carry: training and benchmark sources (check C-I2), datasets,
# base models, third-party models and their training data, and release licences.
#   non_commercial: an input under it makes a model non-commercial; as a release licence it is a
#                   non-commercial licence. It may train non-commercial models only.
#   share_alike:    an input under it makes a model share-alike; release_licences lists the release
#                   licences that satisfy it.
#   trains:         false = never training data of our models (for example licences that appear only
#                   in the training data of third-party models). Default true.
# No-derivatives licences are never listed: an input whose licence is not listed fails closed.
licences:
- {id: CC0-1.0}
- {id: CC-BY-4.0}
- {id: CC-BY-3.0}
- {id: CC-BY-SA-4.0, share_alike: true, release_licences: [CC-BY-SA-4.0]}
- {id: CC-BY-NC-4.0, non_commercial: true}
- {id: CC-BY-NC-SA-4.0, non_commercial: true, share_alike: true, release_licences: [CC-BY-NC-SA-4.0]}
- {id: PDDL-1.0}
- {id: ODC-By-1.0}
- {id: MIT}
- {id: Apache-2.0}
- {id: BSD-2-Clause}
- {id: BSD-3-Clause}
- {id: LicenseRef-official-work-UrhG-5, note: German official works, §5 UrhG}
- {id: LicenseRef-OGL-UK-3.0, note: UK Open Government Licence v3.0}
- {id: LicenseRef-Open-Parliament-Licence, note: UK Open Parliament Licence}
- {id: LicenseRef-US-PD, note: US federal government works, public domain}
# Licences of third-party training data only (never our training data)
- {id: LicenseRef-MSMARCO-terms, non_commercial: true, trains: false, note: "MS MARCO terms: non-commercial research purposes only"}
