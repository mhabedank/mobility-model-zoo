  terms_sha256: c552c293e29534e17b46b75691a36710ec17bcd734e1931f8db6dda14e577657
  terms_checked_at: '2026-10-08'
  output_training_permitted: unclear
  clause: Depends on each model's licence; checked per teacher in configs/productdev/jtbd/models.yaml (license_basis).
  allowed_for: [teacher, reference, pii_review]
  signoff: {by: Martin Habedank, at: '2026-10-08'}
  log_matches:
