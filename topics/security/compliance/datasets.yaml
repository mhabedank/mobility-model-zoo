  citation: 'Lampe and Meng, ''can-train-and-test: A curated CAN dataset for automotive intrusion detection'', Computers
    & Security, 2024. doi:10.11583/DTU.24805533'
  provider: bitbucket
  locator:
    repo: brooke-lampe/can-train-and-test
  license_check: manual
  license_checked: '2026-10-08'
  approx_size_mb: 7500
  used_by: []
  owner: Martin Habedank
  last_reviewed: '2026-10-08'
  next_review: '2027-04-08'
  modifications: Converted to the common frame or feature format for training; not redistributed.
  licence: CC-BY-4.0
  licence_url: https://creativecommons.org/licenses/by/4.0/
  permitted_use: training_allowed
  redistribution: unclear
  redistribution_basis: CC BY 4.0 permits redistribution with attribution; provider terms not yet checked; not published
    (FR-011).
  commercial_use: true
  quote_allowed: false
  signals:
    robots: allow
    tdmrep: absent
    x_robots: absent
    meta_noai: absent
    ai_txt: absent
    checked_at: '2026-10-08'
    retrospective: false
  personal_data: &id001
    present: false
    categories: []
    special_categories: []
    human_subjects: false
    anonymisation: Frame logs of research test vehicles; no driver data stated by the publishers.
  storage: $MMZ_DATA/can-train-and-test (local cache outside git)
  retention_until: '2027-10-08'
  status: active
  reason: null
  class: can-bus-datasets
  vehicle_data: &id002
    vin: unknown
    gps: none
    absolute_timestamps: present
