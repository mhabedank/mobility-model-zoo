- id: can-train-and-test
  title: can-train-and-test
  use_case: CAN intrusion detection across vehicles and attack types (four-way split)
  origin_url: https://bitbucket.org/brooke-lampe/can-train-and-test
  creators:
  - Brooke Elizabeth Lampe
  - Weizhi Meng
  publisher: Technical University of Denmark (DTU)
  doi: 10.11583/DTU.24805533
