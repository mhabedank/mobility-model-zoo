- sha256: 0746f31a7411389e2922053690195a3e871168c78fe314267e7fcf33979c69e0
  captures:
  - can-train-and-test/set_01/test_04_unknown_vehicle_unknown_attack/speed-3
  - can-train-and-test/set_02/test_01_known_vehicle_known_attack/speed-3
  action: relabel
  relabel:
    can-train-and-test/set_01/test_04_unknown_vehicle_unknown_attack/speed-3: chevrolet_traverse
  reason: 'Byte-identical to the set_02 known-vehicle (Traverse) capture of the same name. The upstream
    README names the set_01 unknown vehicle Silverado, but the attack-free CAN IDs of every set_01/test_04
    capture match the Traverse training captures (set_02/train_01) 100 % and the Silverado ones (set_03/train_01)
    74 %, while set_01/test_02 matches Silverado 100 %. The capture stays in set_01/test_04: Traverse
    is not in set_01 training (Impala), so the split stays unknown vehicle, unknown attack. Owner decision
    2026-10-09.'
