# Third-party datasets of the condition-monitoring topic (compliance register, schema datasets.schema.json).
# Data is downloaded to $MMZ_DATA by `zoo data download`, never into the repository. No dataset is
# published (redistribution `unclear` until the provider terms are checked, FR-011).
datasets:
- id: mimii
  title: MIMII - Sound Dataset for Malfunctioning Industrial Machine Investigation and Inspection
  use_case: anomalous machine-sound detection (pumps, fans, valves, slide rails)
  origin_url: https://zenodo.org/records/3384388
  creators:
  - H. Purohit
  - R. Tanabe
  - K. Ichige
  - T. Endo
  - Y. Nikaido
  - K. Suefusa
  - Y. Kawaguchi
  publisher: Hitachi, Ltd. (Zenodo)
  attribution_text: MIMII dataset by H. Purohit, R. Tanabe, K. Ichige, T. Endo, Y. Nikaido, K. Suefusa, Y. Kawaguchi,
    Hitachi, Ltd. (CC BY-SA 4.0)
  citation: 'Purohit et al., ''MIMII Dataset: Sound Dataset for Malfunctioning Industrial Machine Investigation
    and Inspection'', DCASE 2019 Workshop'
  modifications: 'Log-mel features of a sample of the 6 dB fan recordings; not redistributed. Share-alike: models
    trained on it carry CC BY-SA 4.0 obligations.'
  provider: zenodo
  locator:
    zenodo_record: '3384388'
    zenodo_files:
    - 6_dB_fan
    zip_members:
    - - '*/id_00/normal/*.wav'
      - 500
    - - '*/id_00/abnormal/*.wav'
      - 200
    - - '*/id_02/normal/*.wav'
      - 300
    - - '*/id_02/abnormal/*.wav'
      - 150
  license_check: api
  license_checked: '2026-10-08'
  approx_size_mb: 2000
  notes: Only a sample of the 6 dB fan recordings (machines id_00, id_02) is read out of the 10 GB archive via HTTP
    range requests.
  owner: Martin Habedank
  last_reviewed: '2026-10-08'
  next_review: '2027-04-08'
  licence: CC-BY-SA-4.0
  licence_url: https://creativecommons.org/licenses/by-sa/4.0/
  permitted_use: training_allowed
  redistribution: unclear
  redistribution_basis: CC BY-SA 4.0 permits redistribution with attribution under the same licence; provider terms
    not yet checked; not published (FR-011).
  commercial_use: true
  quote_allowed: false
  signals:
    robots: allow
    tdmrep: absent
    x_robots: absent
    meta_noai: absent
    ai_txt: absent
    checked_at: '2026-10-08'
    retrospective: false
  personal_data:
    present: false
    categories: []
    special_categories: []
    human_subjects: false
  storage: $MMZ_DATA/mimii (local cache outside git)
  retention_until: '2027-10-08'
  used_by: []
  status: active
  reason: null
  class: machine-sound-datasets
