id: e13
text: Rund 40.000 Menschen haben am Wochenende das 750-jährige Bestehen der Stadt gefeiert. Auf drei Bühnen
  spielten Bands aus der Region, der Heimatverein zeigte altes Handwerk, und zum Abschluss gab es am Sonntagabend
  ein Feuerwerk über dem Hafen. Die Gastronomen sprachen von einem Rekordwochenende, die Polizei meldete
  nur wenige Einsätze. Die Stadtverwaltung räumte ein, dass ihr für Großveranstaltungen schlicht das Personal
  für die Verkehrsplanung fehlt. Ein Sprecher des Verkehrsverbunds sagte, volle Straßen bei solchen Festen
  seien längst ein Problem für alle. Im nächsten Jahr soll das Fest um einen Tag verlängert werden; der
  Vorverkauf für das Abschlusskonzert beginnt im März.
