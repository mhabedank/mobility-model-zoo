id: e09
text: 'Als Bürgermeister einer kleinen Gemeinde sage ich: Bei uns ist der öffentliche Nahverkehr eigentlich
  nicht vorhanden. Wer kein Auto hat, ist aufgeschmissen. Wir als Gemeinde können keinen eigenen Bus finanzieren,
  und für Förderprogramme fehlt uns das Personal. Das Land müsste dafür sorgen, dass auch Dörfer angebunden
  sind. Mir geht es nicht um einen Bus alle zehn Minuten, sondern darum, dass man überhaupt wegkommt.'
