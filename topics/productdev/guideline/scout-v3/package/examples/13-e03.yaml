id: e03
text: Ich wohne in einem Dorf ohne Laden, und der Bus fährt nur zweimal am Tag. Wenn ich zum Arzt in die
  Kreisstadt muss, geht dafür fast der ganze Tag drauf. Meistens fragt mich dann die Nachbarin, ob sie
  mich mitnehmen soll, aber ich will nicht ständig um Hilfe bitten. Schön wäre ein Bus, der wenigstens
  stündlich fährt.
