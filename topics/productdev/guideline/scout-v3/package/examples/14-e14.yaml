id: e14
text: The 2025 household travel survey covered 4,812 households and 9,930 persons aged six and over in
  the study region. Respondents recorded every trip made on an assigned reference day. On average, each
  person made 3.1 trips a day, covering 38.4 kilometres in 81 minutes. The car accounted for 52 percent
  of trips (39 percent as driver, 13 percent as passenger), walking for 24 percent, cycling for 13 percent
  and public transport for 11 percent. Trip rates were highest among persons aged 30 to 49 and lowest
  among those over 75. Leisure was the most frequent purpose at 31 percent, followed by shopping at 19
  percent and commuting at 17 percent. Compared with the 2017 wave, the share of cycling rose by two percentage
  points, while the share of public transport remained stable. The data were weighted by household size,
  age, sex and district; the response rate was 21 percent. Tables by district are given in Annex B.
