id: e16
text: 'Item 4: Winter maintenance of roads and footways. CLLR HALE: Can I – sorry, is this on? Right.
  In heavy snow the district council cannot keep up with gritting, because we only have six lorries for
  the whole district. Residents on the hill estates were stuck for three days in January, and one of them
  told me she missed a hospital appointment because no taxi would go up there. HIGHWAYS OFFICER: That
  is correct. We want to order four more lorries, but first the capital budget has to be approved by full
  council. BUS OPERATOR: And our school buses could not leave the depot for two days because the access
  road was not gritted, and we – CHAIR: Thank you, we will come back to that under any other business.
  Item 5: Allotment fees.'
