id: e04
text: As a delivery driver in the city centre, I never find anywhere legal to stop. Every day I have to
  double-park, which risks a fine, and the cyclists get angry because I block the bike lane. Last Tuesday
  a cyclist had to swerve into traffic because of my van, and I felt terrible. We need loading bays on
  every street.
