id: e01
text: Die Stadtwerke haben im Oktober 14 neue Elektrobusse in Betrieb genommen. Die Fahrzeuge verkehren
  auf den Linien 3 und 7 und ersetzen ältere Dieselbusse. Der Fahrplan bleibt unverändert; die neuen Busse
  sind an der grünen Lackierung zu erkennen.
