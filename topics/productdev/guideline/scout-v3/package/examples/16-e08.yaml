id: e08
text: I am a single father of two, and on Saturdays we visit my mother on the other side of town. Great,
  another weekend of replacement buses – I love spending an extra hour with two bored kids. It would be
  nice if the trams did not stop running every other weekend. And honestly, I worry that one day I will
  lose one of them in the crowd at the interchange. I just want my kids to see that we can get around
  on our own like everyone else.
