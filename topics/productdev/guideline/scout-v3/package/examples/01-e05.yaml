id: e05
text: Herr Präsident, meine Damen und Herren, in meinem Wahlkreis haben laut der letzten Erhebung des
  Landkreises 62 Prozent der Beschäftigten keine Alternative zum Auto. Viele Pendlerinnen und Pendler
  sagen mir, dass die Spritpreise sie überfordern und sie trotzdem jeden Morgen im Stau stehen. Die Bahnstrecke
  nach Norden wurde vor zwanzig Jahren stillgelegt; ich schätze, gut die Hälfte der Leute würde sofort
  umsteigen, wenn sie wieder fährt. Deshalb fordern wir die Reaktivierung der Bahnstrecke.
