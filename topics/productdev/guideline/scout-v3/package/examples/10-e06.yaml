id: e06
text: 'Our depot runs 40 buses on the regional network. Our drivers report that passengers increasingly
  struggle to find out about delays, and complaints about missing delay information rose by 30 percent
  last year, according to our call centre figures. We also find it hard to recruit drivers: around a third
  of our posts are empty, as far as we can tell. What we want is to give passengers live information they
  can trust.'
