id: e07
text: Morgens bringe ich zuerst meine Tochter zur Kita und fahre dann mit dem Rad zum Bahnhof. Ich nehme
  das Rad, um den Zug um 7:12 zu schaffen. Klappt das nicht, komme ich zu spät zur Arbeit. Und das ist
  mir unangenehm, weil mein Chef jedes Mal so schaut. Ich will pünktlich sein, aber vor allem will ich
  dabei nicht jeden Morgen gehetzt ankommen.
