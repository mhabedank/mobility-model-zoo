id: e11
text: Als mittelständische Spedition beliefern wir täglich rund 300 Filialen im Süden. Unser Ziel ist,
  dass jede Lieferung im vereinbarten Zeitfenster ankommt. Seit die Innenstädte Lieferzonen nur noch bis
  10 Uhr erlauben, schaffen wir das bei etwa jeder fünften Tour nicht mehr. Für uns wäre schon viel gewonnen,
  wenn wir am Nachmittag ein zweites Fenster hätten.
