teacher_task: 'Der Labeler soll herausfinden, wo Pains, Gains und Jobs to be done im text zu finden sind. diese werden dann mit weiteren feldern angereichert. siehe dafür die liste der FElder'
reader: 'Ein Produkt Manager'
domain:
  owner: 'Folge der DEfinition von Mobilität, alles was dazu gehört gehört auch zu umserem Thema.'
  drafted_by: claude
  approval: 'owner, 2026-11-27, in chat (formal approval with hashes follows for the whole guideline package)'
  definition: >-
    Mobility is the movement of people, goods and animals in geographic space, together with
    everything that enables or shapes it. It covers: the trips and transports themselves, by any
    mode and over any distance, including walking, cycling, cars, public transport, rail, air,
    water and freight; the options people and organisations have to move, such as access, cost,
    time and information; the vehicles, services, infrastructure and energy used for it, such as
    roads, stations, parking, fuel and charging; and the work, rules, business and effects that go
    with it, such as jobs in transport and logistics, regulation, prices, congestion and emissions.
    Transport is the movement that actually happens; mobility also includes the possibility to
    move. Not covered: social mobility between classes or jobs, and the transmission of messages
    or energy as such.
  sources:
  - source: 'Wikipedia (de), Räumliche Mobilität'
    url: 'https://de.wikipedia.org/wiki/R%C3%A4umliche_Mobilit%C3%A4t'
    licence: CC-BY-SA-4.0
  - source: 'Wikipedia (en), Transport'
    url: 'https://en.wikipedia.org/wiki/Transport'
    licence: CC-BY-SA-4.0
  - source: 'FGSV, Begriffsbestimmungen'
    url: null
    licence: proprietary
  - source: 'Spektrum, Lexikon der Geographie, Verkehrsmobilität'
    url: 'https://www.spektrum.de/lexikon/geographie/verkehrsmobilitaet/8614'
    licence: proprietary
item_boundaries:
  owner: 'ALso wir sochen merkmale wie pain, gain und JTBD. diese sind durch sprache vcodiert. diese sprache kann auch mehrere sätze dafür verwenden. wir beschrenken nicht nach dem Tool (Sprache) sondern nach der Sinneinheit (z.B. JTBD)'
relevant:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  definition: >-
    A text is relevant when it states at least one job, pain or gain of an actor within mobility
    as defined under domain, told by the actor or reported by someone else. The topic alone is not
    enough. Not relevant: texts that only report facts, figures, events or product features with
    no actor who wants to get something done, struggles or hopes for something; timetables, tariffs
    and technical specifications; a provider praising its own offer without reporting a customer's
    need; texts where mobility is only the backdrop of something else. One passage with a need is
    enough, even if the rest of the text is off-topic.
kind:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  job: >-
    Something an actor is trying to get done or achieve in a situation: a task, a goal or a change
    of state they want. State it, where the text allows, apart from the solution used today.
  pain: >-
    Something that bothers the actor before, during or after getting the job done: an obstacle, a
    cost, a risk, an annoyance, a bad outcome, or the fear of one.
  gain: >-
    An outcome or benefit the actor wants, expects or would welcome: something that makes the job
    easier, faster, cheaper, safer or more pleasant, or a good outcome they already value.
  pain_versus_negated_gain: >-
    Label by what the text describes. A problem the actor has now is a pain, even when phrased as
    a missing benefit. A wish for a better state is a gain, even when phrased with a negation. When
    one passage states both the problem and the wish, label both.
actor_type:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  rule: >-
    The actor is who has the need, not who speaks or writes. actor_type is the coarse class;
    executor_role marks the words that name the specific role.
  individual: A private person acting for themselves or their household.
  worker: A person whose need comes from their work in or around mobility.
  organization: A company, operator, association or other non-state body acting as such.
  public_sector: A public authority or public body acting as such.
  society: The public at large, or an unnamed group, when the need is stated for everyone.
evidence_type:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  rule: >-
    How the text backs the need, as an ordinal scale from opinion (lowest) to measurement
    (highest).
  opinion: A view, belief, wish or judgement with no experience given.
  anecdote: One concrete experience, a single event.
  routine: Repeated or habitual experience of the actor (always, every day, usually).
  observation: >-
    Something seen across other people or over a longer time, stated without a figure from
    counting or measuring.
  measurement: A figure obtained by counting or measuring, such as a survey result, a statistic or a measured time.
  boundaries: >-
    Anecdote versus routine: one event is an anecdote; words of frequency or several events make it
    routine. Observation versus measurement: a measurement needs a figure that was counted or
    measured; an estimate such as "about half, I would say" is an observation.
evidence_scope:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  single: One case, one actor or one event.
  multiple: Several or many cases, stated without a number.
  quantified: The text gives a number, share or amount for how many or how much; an estimate with a figure counts.
quote:
  owner_choice: 'Nur Zitat (Recommended)'
  rule: >-
    Each item is a verbatim quote in the source language with its offsets. No statement or
    translation is written per item.
doubt:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  item: >-
    When unsure whether a passage is an item, ask whether a product manager could learn a need from
    it. If not, leave it out. Never add context that the text does not give.
  kind: Take the kind the text stresses; if it clearly states both a problem and a wish, label both.
  levels: For evidence_type and evidence_scope, take the lower grade.
  fields: When a field is not stated or you are unsure, leave it empty. An empty field is correct.
empty_result:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  rule: >-
    An empty item list is correct when the text states no job, pain or gain in mobility as defined
    under domain; relevant is then false. Because relevance follows from items, "relevant but no
    item" is not a valid result. No score rewards filling a result.
job_kind:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  applies_to: job
  functional: The practical task or result the actor wants to get done.
  emotional: How the actor wants to feel, or wants to avoid feeling, while getting it done.
  social: How the actor wants to be seen by others, or to stand with them.
  rule: >-
    One value per job item: the one the text stresses. Empty for pains and gains. If a passage
    states a practical and a feeling side as two separate wishes, label two jobs.
executor_role:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  rule: >-
    A pointer to the shortest verbatim span that names who has the need by a role: a noun or noun
    phrase that says what the person or body is, such as an occupation, a life situation or an
    organisation type. It may lie outside the item's quote but within the same text. Pronouns and
    generic words such as "I", "we" or "people" do not count. If several roles are named, take the
    one that has this need. Empty if no role is named.
actor_pair:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  rule: >-
    A link between two items of different actors when the text says that the way one actor gets
    their job done causes the other actor's pain, at the same place, time or resource. At least one
    of the two items is a pain. Both items must be in the text. A clash known only from general
    knowledge is not linked.
mode:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  values: [walk, bicycle, micromobility, motorcycle, car, taxi_ridehailing, bus, tram_metro, train, coach, public_transport, truck_van, air, water, other]
  rule: >-
    All modes the item names, as a list. Use public_transport when the text names public transport
    without a mode. A word that belongs to exactly one mode counts, such as a bus driver for bus or
    a wallbox for car. Empty if the item names no mode; do not infer one from the context alone.
situation:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  rule: >-
    A pointer to the shortest verbatim span that says where, when or on what occasion the need
    arises: a place, a time of day, week or year, or an occasion such as a trip purpose or what the
    actor carries. It may lie outside the item's quote but within the same text. If several are
    named, take the one tied to this need. Empty if none is named.
improve:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  values: [time, cost, effort, reliability, safety, comfort, access, information, flexibility, environment, other]
  rule: >-
    What the actor wants more or less of, as a list, for jobs, pains and gains. The direction
    follows from the kind: a pain asks for less of the problem, a gain for more of the benefit.
    Only values the text states. Empty if none is stated.
states_solution:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  rule: >-
    True when the item names a concrete product, service, feature or measure that the actor wants,
    instead of the need behind it. The item keeps its kind and is not dropped. The need behind it
    is a separate item only if the text states it. False otherwise.
means_end:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  rule: >-
    A directed link from item A to item B of the same actor when the text says that A is done or
    wanted in order to achieve B, marked by words such as "um zu", "damit", "in order to", "so that"
    or "because I need to". No link when the connection is only implied. Items of different actors
    are not linked here.
order:
  drafted_by: claude
  approval: 'owner, 2026-11-28, in chat'
  values: [before, during]
  rule: >-
    A directed link between two items of one text when words in the text order them in time, such
    as "zuerst", "dann", "bevor", "während", "first", "then", "after" or "while". before means A
    comes before B; during means A and B happen at the same time. The order of sentences alone does
    not count. Order across texts is never labeled.
language:
  owner_choice: 'Code erkennt (Recommended)'
  rule: Detected by code per text, not labeled. A mixed text gets its main language.
