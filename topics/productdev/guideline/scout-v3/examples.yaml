- id: e12
  language: en
  shows: [long and dense like a real chunk, speaker is not the actor, sentences without items, one need over two clauses, two needs joined by and, a cause joined by because stays inside, reporting frame stays outside the quote, negated mode counts, role named once applies to all of that actor's items, hazard and destination are no situation, sub-clause merges into its job]
  text: >-
    Thank you, Chair. I am speaking for the older residents of Millbrook. Most of our members no longer
    drive, and the nearest supermarket is a long way off. The bus stop on the high street has no shelter,
    so people wait in the rain, and several members have told me they have slipped on the uneven kerb
    there. The timetable is posted in tiny print that nobody can read. Drivers are often kind, but some
    pull away before older passengers have sat down, which frightens people. Booking the community
    minibus means phoning a number that is only staffed on weekday mornings, and many members find that
    confusing. People tell us they feel cut off and lonely because visiting friends has become such an
    effort. We would like the council to talk to us before changing routes, because the last change
    happened without any warning. Above all, our members want to get to the shops, the surgery and the
    library without having to depend on their children.
  relevant: true
