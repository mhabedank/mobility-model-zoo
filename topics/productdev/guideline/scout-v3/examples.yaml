    für Großveranstaltungen schlicht das Personal für die Verkehrsplanung fehlt. Ein Sprecher des
    Verkehrsverbunds sagte, volle Straßen bei solchen Festen seien längst ein Problem für alle. Im
    nächsten Jahr soll das Fest um einen Tag verlängert werden; der Vorverkauf für das
    Abschlusskonzert beginnt im März.
