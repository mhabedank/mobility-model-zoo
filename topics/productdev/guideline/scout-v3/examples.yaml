  text: >-
    Ich bin Lkw-Fahrer und fahre für ein Bauunternehmen Kies von der Grube zu den Baustellen am
    Stadtrand. Jeden Morgen muss ich bis sieben Uhr die erste Ladung an der Baustelle im Neubaugebiet
    abliefern, und der einzige Weg dorthin führt durch eine Wohnstraße. Die Anwohner beschweren sich,
    weil ihre Fenster klirren, wenn ich mit dem Laster durchfahre. Wir Fahrer verlieren außerdem jeden
    Morgen eine halbe Stunde in der Schlange vor der Waage an der Grube. Während ich an der Baustelle oft
    eine Stunde warten muss, bis ich abkippen darf, macht mir der Disponent am Telefon Druck wegen der
    nächsten Tour. Am liebsten wäre mir eine eigene Baustraße, damit sich Laster, Busse und Radfahrer an
    der engen Kreuzung nicht mehr gefährlich nahe kommen.
  relevant: true
