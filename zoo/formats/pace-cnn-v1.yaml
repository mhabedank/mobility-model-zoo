# Field meanings of the format pace-cnn-v1, for the website (feature 021, T069; feature 008, FR-008).
# Types and allowed values come from the JSON schema named below; this file only adds what the
# schema cannot say. `zoo site build` fails if a schema path has no entry here or an entry has no
# schema path (check B5). pace-cnn runs as int8 C on a microcontroller and returns six class scores
# per window; this format is the published record of one input window with the expected scores, as
# in the model's examples, and the release gate reproduces it bit-exactly on the host reference.
id: pace-cnn-v1
title: One IMU window in int8 with the expected activity scores
schema: src/mobility_model_zoo/condition_monitoring/activity/pace-cnn-v1.schema.json
input:
  - "One window of 2.56 seconds of a waist-worn 6-axis IMU at 50 Hz: 128 samples of 9 channels (body acceleration xyz, gyroscope xyz, total acceleration xyz), normalised and quantised to int8 as `config.json` of the release describes."
  - "The preparation from raw accelerometer (g) and gyroscope (rad/s) readings is part of the input contract: noise filters, gravity separation at 0.3 Hz, normalisation with the training-subject constants and int8 quantisation."
  - "On the device, `mi_invoke(&mi_model_pace_cnn, window, scores, arena, sizeof arena)` takes the 1,152 int8 values and writes six int8 scores."
rules:
  - "`input` holds 1,152 int8 values, row-major: sample t, then channel c (index t * 9 + c)."
  - "`expected` holds six int8 scores in the label order of `config.json`; the highest score is the predicted activity."
  - "The C code of the release and the int8 host reference give identical scores for every example (checked bit-exactly by the release gate and on the reference board)."
edge_cases:
  - input: Synthetic uniform int8 values, as in the published examples
    output: Six scores that check the arithmetic; they do not describe an activity.
  - input: A window from another sensor placement, sample rate or unit
    output: The model cannot detect this and still returns six scores; prepare windows exactly as the input contract says.
  - input: Transport modes such as car, bus or bicycle
    output: Not covered; the training data has no vehicle classes.
versioning: >-
  The format name ends in the version of the input and output layout. pace-cnn 0.1.0 uses
  pace-cnn-v1. A change of channels, window, preparation or score layout gets a new format version;
  the old version stays documented.
fields:
  format:
    meaning: "The format of the record, always `pace-cnn-v1`."
  source:
    meaning: "Where the input comes from: `synthetic` (generated by the zoo). Dataset windows are not published."
  generator:
    meaning: "The generator of a synthetic input: its `name` (`uniform-int8`), `version`, random `seed` and the `index` in the generated sequence, so the input can be generated again."
  input:
    meaning: "The model input: 1,152 int8 values, 128 samples of 9 channels in the channel order of `config.json`."
  expected:
    meaning: "The expected output of the int8 host reference: six int8 scores in label order (walking, walking upstairs, walking downstairs, sitting, standing, laying)."
