# Art direction of the website imagery (feature 016, research R13): the house style SIEBDRUCK.
# 1970s West German modernist poster illustration, quietly futurist, calm and precise. Flat
# screen-print colour fields, clean geometry, long diagonals. Sky, ground and buildings only in
# deep navy, pale mint and warm cream; ONE warm orange-yellow accent reserved for the main vehicle
# or machine. Every image record's prompt is one subject below followed by `style` (check I2).
#
# Feature 019: subjects live under `themes` (theme id -> subjects with id, prompt, aspect, scene,
# alt); `palette` and `duplicate_max_bits` hold the thresholds of checks I6 and I7; `negative`
# gained the AI-cliché terms and `negative_history` keeps the earlier text so the six 016 records
# stay valid (research R2).
name: siebdruck
style: >-
  1970s modernist travel poster illustration, flat colour fields with crisp edges, screen print texture,
  clean geometric forms, calm ordered composition with long diagonals, soft gradient sky in pale mint and warm cream,
  deep navy shadows and ground, the main vehicle or machine painted in a warm orange-yellow accent colour,
  everything else only navy, mint and cream, early morning light as graphic shapes, quietly futurist and optimistic,
  West German graphic design of the seventies, restrained, no text, no lettering, no logos, no faces,
  people only as small simple silhouettes
negative: >-
  text, letters, words, watermark, logo, signature, face, portrait, photo, photorealistic, glossy, 3d render,
  neon, chrome, robot, spaceship, retro kitsch, cluttered, blurry, orange sky, orange ground,
  brain, glowing network, hologram, floating icons, circuit pattern
negative_history:
  - >-
    text, letters, words, watermark, logo, signature, face, portrait, photo, photorealistic, glossy, 3d render,
    neon, chrome, robot, spaceship, retro kitsch, cluttered, blurry, orange sky, orange ground
models:
  draft:
    id: black-forest-labs/FLUX.2-klein-4B
    pipeline: Flux2KleinPipeline
    licence: Apache-2.0
    card: https://huggingface.co/black-forest-labs/FLUX.2-klein-4B
    steps: 4
    guidance: 1.0
  final:
    id: Qwen/Qwen-Image-2512
    pipeline: QwenImagePipeline
    licence: Apache-2.0
    card: https://huggingface.co/Qwen/Qwen-Image-2512
    steps: 50
    true_cfg_scale: 4.0

# Check I6 (feature 019, research R4). Anchors are CIELAB triples (L 0-100, a, b); `calibrated`
# turns true once T025 has measured them on the six approved 016 images and tuned the thresholds.
palette:
  calibrated: true  # 2026-10-14 on the 016 renders: 78 approved renders (out6) vs 55 rejected
  # (night-and-rain, photoreal); `other` separates them with margin (approved max 17.5%,
  # rejected min 27.5%), see specs/019-mobility-image-library/validation.md
  anchors:
    accent: [57.0, 21.5, 53.9]
    tone1: [11.9, 3.2, -21.2]
    tone2: [29.1, -6.1, -14.9]
    tone3: [53.1, -14.3, -2.4]
    tone4: [81.9, -18.1, 7.1]
    tone5: [92.2, -4.7, 14.7]
  tolerance_de: 18
  other_max: 0.22
  accent_min: 0.0015
  accent_max: 0.30
  largest_min: 0.07
  top_max: 0.15
# Check I7 (research R5): pHash Hamming distance at or below this is a near-duplicate.
duplicate_max_bits: 10

