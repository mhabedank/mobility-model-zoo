change_type: initial
changes: 'Calibrate on the vehicle, then detect. A per-vehicle table learned on the host from benign traffic;
  10 features relative to it (frame counts per identifier in 8 time buckets, unknown-identifier counts,
  DLC, payload changes), computed by the C library msml_cal on host and device alike. Rules on these features
  decide (count above the calibrated maximum by more than 25 %, unknown-identifier burst, DLC change),
  then the alarm stage; the forest score is published as information (owner decision 2026-10-11). can-ids-v3:
  ROAD F1 0.997, 0 false alarms per hour on the ROAD test drives, at most 0.86 per hour on unknown vehicles;
  KCID Ford Focus and Traverse 0 alarms in 26.9 h. Experimental: calibration-dependent false alarms, new
  identifiers flood alarms, emulator-only device evidence.'
