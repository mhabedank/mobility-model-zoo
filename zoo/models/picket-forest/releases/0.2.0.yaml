changes: 'Draft (feature 010). Calibrate on the vehicle, then detect: a fixed per-vehicle table learned from benign traffic, 10 vehicle-relative features (frame counts per ID against the calibrated maximum, unknown-ID counts), the forest, and an event-level decision (spread over an injection episode, fuzzing state). On can-ids-v3: ROAD F1 0.997, 0 false alarms per hour on the ROAD test ambient captures, at most 0.86 per hour on unknown vehicles; KCID (vehicles in no training data): 0 alarms in 74.9 h. Not yet exported to C and not measured on a device; the shuffled-label control fails its pre-registered rule (explained in specs/010-picket-forest-v2/validation.md).'
