# Website text of picket-forest (features 010, 014). Schema: src/mobility_model_zoo/site/schemas/site.schema.json.
# Numbers only as {metric:<kind>.<name>} placeholders (checks B2, F2; gate rule 17).
# Feature 014 budgets: audience at most 25 words; 3-4 differentiators, title at most 5 words and
# text at most 20; no release status (the page generates it from the release record).
tagline: CAN intrusion detector for microcontrollers, calibrated on your vehicle's normal traffic.
share_line: CAN intrusion detector for microcontrollers, calibrated on your vehicle's normal traffic.
audience: >-
  For researchers, students and embedded engineers who study in-vehicle network security on a test
  bench and want an open, measured detector.
differentiators:
  - title: Calibrated on the vehicle
    text: >-
      Learns normal frame counts per identifier from benign traffic of the target vehicle and judges
      every frame against them.
  - title: Small enough for a microcontroller
    text: >-
      Plain C: {metric:performance.flash_kb} of flash and {metric:performance.ram_kb} of memory on an
      ESP32 (emulator); C and Python agree.
  - title: Measured on unseen vehicles
    text: >-
      At worst {metric:quality.fa_per_hour_default_unknown_vehicle_unknown_attack_worst} false alarms per
      hour on unknown vehicles of the benchmark.
  - title: Open and reproducible
    text: >-
      Code, features and thresholds are public; the release gate reproduces every example result from
      the C code.
quickstart_example: 01-fabrication.json
hardware_note: >-
  Needs a host with Python to build the calibration table and an ESP32-class microcontroller (or the
  host build) to run the detector. Classic CAN only.
metric_cards:
  - label: Attack-class F1 on ROAD
    metric: quality.f1_road
  - label: Worst false alarms per hour, unknown vehicles
    metric: quality.fa_per_hour_default_unknown_vehicle_unknown_attack_worst
  - label: Flash (ESP32, emulator)
    metric: performance.flash_kb
  - label: Memory (ESP32, emulator)
    metric: performance.ram_kb
