name: picket-forest
topic: security
task: can-ids
variant: forest
runtime: mcu
engine: emlearn
title: 'Picket (forest): CAN bus intrusion detection on a microcontroller'
summary: 'Experimental, not production ready. A CAN intrusion detector that is first calibrated on benign traffic of the target vehicle, then scores every classic CAN frame from features relative to that calibration (frame counts per identifier, unknown identifiers), with a random forest and an event-level decision. It runs as plain C on ESP32-class microcontrollers; C and Python give identical results.'
license: Apache-2.0
usage_class: commercial
license_exception: null
base_model: null
base_model_license: null
languages: []
pipeline_tag: tabular-classification
library_name: sklearn
tags: [can-bus, intrusion-detection, tinyml, emlearn, random-forest, experimental]
repos:
  public: mobility-model-zoo/picket-forest
  staging: mobility-model-zoo/picket-forest-staging
card:
  intended_use: |
    Research, teaching and bench testing of in-vehicle intrusion detection on classic CAN; a reproducible baseline for calibrated, microcontroller-sized CAN intrusion detection; a starting point for a security sensor that reports events to an IDS manager. Status: experimental, not production ready (see limitations).
  out_of_scope: |
    Deployment in vehicles on public roads: the model is not a validated or certified safety or security mechanism and makes no ISO/SAE 21434 or UNECE R155 claim; no safety-critical use without a vehicle-specific validation. Active countermeasures (blocking or injecting frames) based on its output. CAN FD and automotive Ethernet.
  input_output: |
    Calibration (host, once per vehicle): benign candump logs of the vehicle -> `picket_forest_table.h` (`security can-ids v2 table`); cover driving, idle and parked phases, at least 60 minutes. Input (device): one classic CAN frame at a time (timestamp in microseconds, 11-bit identifier, DLC, up to 8 data bytes). Output: a forest score per frame (share of trees voting attack), the event decision and an alarm flag from the alarm stage (3 flagged frames within 200 ms, then 1 s hold-off).
  install: pip install "mobility-model-zoo[edge] @ git+https://github.com/mhabedank/mobility-model-zoo@<tag>"
  how_to_run: |
    import joblib
    from huggingface_hub import hf_hub_download

    from mobility_model_zoo.security.can_ids import calibrated as cal
    from mobility_model_zoo.security.can_ids.release_export_v2 import reference

    saved = joblib.load(hf_hub_download("{repo_id}", "model.joblib", revision="{revision}"))
    table = cal.calibrate(benign_captures)  # dicts with ts (s), can_id, dlc, data (n x 8), y (zeros)
    scores, alarms = reference(capture, table, saved["model"], saved["threshold"])
  device_usage: |
    /* Headers from {repo_id} at {revision}; replace picket_forest_table.h with your vehicle's table. */
    #include "picket_forest_v2.h"

    static picket_forest_v2_t ids;
    picket_forest_v2_init(&ids);
    float score;
    int alarm = picket_forest_v2_process(&ids, ts_us, can_id, dlc, data, &score, NULL);
  limitations: |
    - Experimental, not production ready (constitution 2.2.0).
    - False alarms depend on the calibration: on ROAD's test drives 0 per hour with 142 min of calibration, about 6 per hour with 60 min and about 44 per hour with 15 min. A calibration must cover the vehicle's operating modes (driving, idle, parked, diagnostics).
    - One new legitimate identifier after calibration floods alarms: on the AutoHack C-CAN bus one identifier missing from the calibration caused several hundred false alarms per hour; a diagnostic dongle plugged in after calibration causes about 1,000 per hour.
    - On the goal metrics the forest adds little over untrained rules on the same calibration; on unseen vehicles it misses most injected fabrication attacks that the rules catch (positive control on KCID).
    - The shuffled-label control failed its pre-registered rule (the calibrated features are themselves anomaly signals); the test captures of can-train-and-test and ROAD were scored five times during development (all logged).
    - Masquerade (a silenced ECU replaced at its normal timing) is not detected. Classic CAN only; no CAN FD.
    - No adversarial evaluation: an attacker who knows the features can shape the injection. The model, features and thresholds are public; do not rely on it as the only line of defence.
    - Calibration is done on the host and compiled into the device; on-device calibration is not implemented.
  citation: |
    @misc{mobility-model-zoo-picket-forest,
      title  = {Picket (forest): CAN bus intrusion detection on a microcontroller, mobility-model-zoo},
      author = {Habedank, Martin},
      year   = {2026},
      url    = {https://huggingface.co/mobility-model-zoo/picket-forest}
    }
