model: scout-large
version: 0.1.2
state: draft
ai_system:
  is_system: true
  rationale: Weights are published together with inference code (SpanExtractor), so the model is usable
    as a machine-based system that infers outputs from input text (Art. 3(1)).
gpai:
  is_gpai: false
  generative: false
  params: 560000000.0
  training_compute_flop: 2.7e+16
  base_model_compute_flop: 2.1e+22
  method: 'Fine-tuning: 6 x 5.6e8 parameters x 1.0e6 training tokens x 8 epochs. Base model: 6 x 5.6e8
    x 6.3e12 tokens from the XLM-R training setup (Conneau et al. 2020: 1.5M updates, batch 8192, sequence
    length 512). Own estimates, not provider figures.'
  rationale: A token-classification encoder for one task (extracting jobs, pains and gains); it does not
    generate content and is not capable of a wide range of distinct tasks; compute far below the indicative
    10^23 FLOP of the Commission GPAI guidelines (July 2025).
exclusion_basis: art2_12
monetisation: none
intended_purpose: 'Product discovery in mobility: finding what people try to get done (jobs), what gets
  in their way (pains) and what they would gain, in interviews, forum posts, reviews, studies and other
  texts. Every item comes with the sentence or clause it was found in, so a person can check it. The output
  is input for later steps (deduplication, clustering, prioritization), which this model does not do.'
out_of_scope:
- Decisions about individuals; profiling or identifying the authors of texts; texts outside mobility (it
  was trained on mobility texts only); treating the output as a complete or final list of needs without
  human review.
annex_iii_match: none (no use in employment, education, credit, essential services, law enforcement, migration,
  justice or biometrics is intended)
annex_i:
  legislation: none
  safety_component: false
  rationale: Text analysis for product discovery; not a component of a product covered by Annex I.
art50_trigger: none (no interaction with natural persons, no generated content)
legal_references:
  ai_act: Regulation (EU) 2024/1689 as amended by the digital omnibus (in force 2026-07-27)
  guidelines:
  - Commission guidelines on the definition of an AI system (Feb 2025)
  - Commission guidelines on general-purpose AI models (July 2025)
  - AI Office template for the public summary of training content (July 2025)
  checked_at: '2026-10-08'
export:
  self_classification: not listed (Regulation (EU) 2021/821, Annex I)
  rationale: A text classifier for product discovery; no cryptography, no intrusion software, no listed
    item.
licences:
  weights: Apache-2.0
  code: Apache-2.0
  base_model: MIT
  notices:
  - XLM-RoBERTa large (FacebookAI/xlm-roberta-large), MIT, Copyright (c) Facebook, Inc. and its affiliates.
  share_alike_inputs: false
  gated: false
