name: scout-large
topic: productdev
task: jtbd
variant: large
title: 'Scout (large): jobs, pains and gains in mobility texts'
summary: Finds jobs-to-be-done, pains and gains in German and English mobility texts. It classifies every sentence and clause as job, pain, gain or no item, with actor type, evidence type and evidence scope, and quotes the text verbatim. It reads a 9,000-character interview in a few seconds on a CPU.
license: Apache-2.0
license_exception: null
base_model: FacebookAI/xlm-roberta-large
base_model_license: MIT
languages: [de, en]
pipeline_tag: token-classification
library_name: pytorch
tags: [jobs-to-be-done, product-discovery, evidence-extraction, span-extraction, xlm-roberta]
repos:
  public: mobility-model-zoo/scout-large
  staging: mobility-model-zoo/scout-large-staging
card:
  intended_use: |
    Product discovery in mobility: finding what people try to get done (jobs), what gets in their way (pains) and what they would gain, in interviews, forum posts, reviews, studies and other texts. Every item comes with the sentence or clause it was found in, so a person can check it. The output is input for later steps (deduplication, clustering, prioritization), which this model does not do.
  out_of_scope: |
    Decisions about individuals; profiling or identifying the authors of texts; texts outside mobility (it was trained on mobility texts only); treating the output as a complete or final list of needs without human review.
  input_output: |
    Input: a text in German or English, any length (it is read in overlapping 512-token windows). Output: JSON with `relevant` (does the text contain jobs, pains or gains at all), its probability, and a list of items. Each item has `kind` (job, pain or gain), `quote` (verbatim, with character offsets), `actor_type`, `evidence_type` and `evidence_scope`. An empty list is a valid result.
  install: pip install "mobility-model-zoo @ git+https://github.com/mhabedank/mobility-model-zoo@<tag>"
  how_to_run: |
    import json

    from mobility_model_zoo.productdev.jtbd.span import SpanExtractor

    model = SpanExtractor.from_pretrained("{repo_id}", revision="{revision}")
    print(json.dumps(model.extract({text}), ensure_ascii=False, indent=2))
  limitations: |
    - It does not produce a free-text actor or an English statement of the job, pain or gain, which the generative approach does; it gives the actor type and the verbatim quote only.
    - Items are whole sentences or clauses; a job that spans several sentences is split.
    - Quality numbers are agreement with frontier reference models on a frozen benchmark, not accuracy against human judgement. Evidence type and actor type are its weakest dimensions.
    - Trained on German and English mobility texts; other languages and domains are untested.
    - Texts can contain personal data. The model does not remove it; redact texts before sharing outputs.
  citation: |
    @misc{mobility-model-zoo-scout,
      title  = {Scout (large): jobs, pains and gains in mobility texts, mobility-model-zoo},
      author = {Habedank, Martin},
      year   = {2026},
      url    = {https://huggingface.co/mobility-model-zoo/scout-large}
    }
