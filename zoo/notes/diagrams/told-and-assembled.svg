<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-labelledby="d-told-and-assembled-t d-told-and-assembled-d">
<title id="d-told-and-assembled-t">An order told in one text, and an order assembled across four</title>
<desc id="d-told-and-assembled-d">Above, in a field marked told in one text, one continuous line with three stations: buy at the machine, then get on, then realise only at the second stop that it was the wrong zone; the quote they come from is printed underneath. Below, in a field marked assembled across texts, four separate cards from texts A to D: no trains in the app, a queue at the machine, the platform changed, the connection missed. They are joined by dashed, highlighted arrows each marked with a question mark. A note says every step has a quote behind it, but the order between them has none.</desc>
<g font-family="inherit">
<rect x="0" y="0" width="700" height="140" rx="2" fill="var(--surface-2)"/>
<text x="16" y="24" font-size="10.5" font-weight="650" fill="var(--muted)" letter-spacing="1.05">TOLD IN ONE TEXT</text>
<path d="M60,70 L640,70" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round"/>
<circle cx="100" cy="70" r="4.5" fill="var(--bg)" stroke="var(--text)" stroke-width="2"/>
<text x="100" y="96" font-size="13" font-weight="500" fill="var(--text)" text-anchor="middle">Buy at the machine</text>
<circle cx="350" cy="70" r="4.5" fill="var(--bg)" stroke="var(--text)" stroke-width="2"/>
<text x="350" y="96" font-size="13" font-weight="500" fill="var(--text)" text-anchor="middle">Get on</text>
<circle cx="600" cy="70" r="4.5" fill="var(--bg)" stroke="var(--text)" stroke-width="2"/>
<text x="600" y="96" font-size="13" font-weight="500" fill="var(--text)" text-anchor="middle">Realise: wrong zone</text>
<text x="225" y="58" font-size="11" font-weight="400" fill="var(--muted)" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">then</text>
<text x="475" y="58" font-size="11" font-weight="400" fill="var(--muted)" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">only at the second stop</text>
<text x="350" y="124" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle" font-style="italic">“I bought it at the machine, got on, and only at the second stop realised…”</text>
<rect x="0" y="160" width="700" height="160" rx="2" fill="var(--surface-2)"/>
<text x="16" y="184" font-size="10.5" font-weight="650" fill="var(--muted)" letter-spacing="1.05">ASSEMBLED ACROSS TEXTS</text>
<text x="12" y="214" font-size="10.5" font-weight="600" fill="var(--muted)" font-family="'JetBrains Mono', ui-monospace, monospace">TEXT A</text>
<rect x="12" y="222" width="124" height="50" rx="2" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1"/>
<text x="26" y="243" font-size="13" font-weight="500" fill="var(--text)">No trains</text>
<text x="26" y="260" font-size="13" font-weight="500" fill="var(--text)">in the app</text>
<path d="M140,247 L185.5,247" fill="none" stroke="var(--mark)" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3"/><polygon points="192,247 185,243 185,251" fill="var(--mark)"/>
<text x="166" y="238" font-size="13" font-weight="700" fill="var(--text)" text-anchor="middle">?</text>
<text x="196" y="214" font-size="10.5" font-weight="600" fill="var(--muted)" font-family="'JetBrains Mono', ui-monospace, monospace">TEXT B</text>
<rect x="196" y="222" width="124" height="50" rx="2" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1"/>
<text x="210" y="243" font-size="13" font-weight="500" fill="var(--text)">Queue at</text>
<text x="210" y="260" font-size="13" font-weight="500" fill="var(--text)">the machine</text>
<path d="M324,247 L369.5,247" fill="none" stroke="var(--mark)" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3"/><polygon points="376,247 369,243 369,251" fill="var(--mark)"/>
<text x="350" y="238" font-size="13" font-weight="700" fill="var(--text)" text-anchor="middle">?</text>
<text x="380" y="214" font-size="10.5" font-weight="600" fill="var(--muted)" font-family="'JetBrains Mono', ui-monospace, monospace">TEXT C</text>
<rect x="380" y="222" width="124" height="50" rx="2" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1"/>
<text x="394" y="243" font-size="13" font-weight="500" fill="var(--text)">Platform</text>
<text x="394" y="260" font-size="13" font-weight="500" fill="var(--text)">changed</text>
<path d="M508,247 L553.5,247" fill="none" stroke="var(--mark)" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3"/><polygon points="560,247 553,243 553,251" fill="var(--mark)"/>
<text x="534" y="238" font-size="13" font-weight="700" fill="var(--text)" text-anchor="middle">?</text>
<text x="564" y="214" font-size="10.5" font-weight="600" fill="var(--muted)" font-family="'JetBrains Mono', ui-monospace, monospace">TEXT D</text>
<rect x="564" y="222" width="124" height="50" rx="2" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1"/>
<text x="578" y="243" font-size="13" font-weight="500" fill="var(--text)">Connection</text>
<text x="578" y="260" font-size="13" font-weight="500" fill="var(--text)">missed</text>
<text x="350" y="302" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle">every step has a quote behind it, the order between them has none</text>
</g>
</svg>
