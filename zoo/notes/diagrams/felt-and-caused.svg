<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 334" width="700" height="334" role="img" aria-labelledby="d-felt-and-caused-t d-felt-and-caused-d">
<title id="d-felt-and-caused-t">Two means-end chains at the ticket counter, and the link between them</title>
<desc id="d-felt-and-caused-d">Two fields side by side. In the traveller&#x27;s, where the problem is felt, three cards climb by in order to: buy the right ticket now, get to work on time, manage without a car. The bottom card is highlighted: the only step anybody writes a forum post about. In the operator&#x27;s, where it is caused, three cards climb from staffing the counter to setting the fare zones to paying for the network; the middle card is marked as the cause. A dashed link labelled inferred runs from the fare zones to the ticket purchase.</desc>
<g font-family="inherit">
<rect x="0" y="0" width="290" height="334" rx="2" fill="var(--surface-2)"/>
<text x="16" y="26" font-size="10.5" font-weight="650" fill="var(--muted)" letter-spacing="1.05">TRAVELLER · WHERE IT IS FELT</text>
<rect x="410" y="0" width="290" height="334" rx="2" fill="var(--surface-2)"/>
<text x="426" y="26" font-size="10.5" font-weight="650" fill="var(--muted)" letter-spacing="1.05">OPERATOR · WHERE IT IS CAUSED</text>
<path d="M426,166 L358,166 Q350,166 350,174 L350,256 Q350,264 342,264 L281.5,264" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3"/><polygon points="275,264 282,260 282,268" fill="var(--text)"/>
<rect x="16" y="48" width="258" height="40" rx="2" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1"/>
<text x="32" y="73" font-size="13" font-weight="500" fill="var(--text)">Manage without a car</text>
<rect x="16" y="146" width="258" height="40" rx="2" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1"/>
<text x="32" y="171" font-size="13" font-weight="500" fill="var(--text)">Get to work on time</text>
<rect x="16" y="244" width="258" height="40" rx="2" fill="var(--surface)" stroke="var(--text)" stroke-width="2"/>
<circle cx="34" cy="264" r="6" fill="var(--mark)" stroke="var(--text)" stroke-width="2"/>
<text x="48" y="269" font-size="13" font-weight="700" fill="var(--text)">Buy the right ticket, now</text>
<path d="M145,243 L145,193.5" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-linejoin="round"/><polygon points="145,187 141,194 149,194" fill="var(--text)"/>
<text x="155" y="219" font-size="11" font-weight="400" fill="var(--muted)" font-family="'JetBrains Mono', ui-monospace, monospace">in order to</text>
<path d="M145,145 L145,95.5" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-linejoin="round"/><polygon points="145,89 141,96 149,96" fill="var(--text)"/>
<text x="155" y="121" font-size="11" font-weight="400" fill="var(--muted)" font-family="'JetBrains Mono', ui-monospace, monospace">in order to</text>
<rect x="426" y="48" width="258" height="40" rx="2" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1"/>
<text x="442" y="73" font-size="13" font-weight="500" fill="var(--text)">Pay for the network</text>
<rect x="426" y="146" width="258" height="40" rx="2" fill="var(--surface)" stroke="var(--text)" stroke-width="2"/>
<circle cx="444" cy="166" r="5.5" fill="var(--bg)" stroke="var(--text)" stroke-width="2"/>
<text x="458" y="171" font-size="13" font-weight="700" fill="var(--text)">Set the fare zones</text>
<rect x="426" y="244" width="258" height="40" rx="2" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1"/>
<text x="442" y="269" font-size="13" font-weight="500" fill="var(--text)">Staff the counter</text>
<path d="M555,243 L555,193.5" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-linejoin="round"/><polygon points="555,187 551,194 559,194" fill="var(--text)"/>
<text x="565" y="219" font-size="11" font-weight="400" fill="var(--muted)" font-family="'JetBrains Mono', ui-monospace, monospace">in order to</text>
<path d="M555,145 L555,95.5" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-linejoin="round"/><polygon points="555,89 551,96 559,96" fill="var(--text)"/>
<text x="565" y="121" font-size="11" font-weight="400" fill="var(--muted)" font-family="'JetBrains Mono', ui-monospace, monospace">in order to</text>
<rect x="320" y="205" width="60" height="18" rx="2" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1"/>
