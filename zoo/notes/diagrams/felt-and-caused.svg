<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" width="700" height="370" role="img" aria-labelledby="d-felt-and-caused-t d-felt-and-caused-d">
<title id="d-felt-and-caused-t">Two means-end chains at the ticket counter, and the edge that crosses between them</title>
<desc id="d-felt-and-caused-d">On the left, the traveller's chain climbs from buying the right ticket now, to getting to work on time, to managing without a car. On the right, the operator's chain climbs from staffing the counter, to setting the fare zones, to paying for the network. The two chains start and end at different heights. A dashed edge runs from the operator's fare zones down to the traveller's ticket purchase: the cause on one chain, the pain on the other. A note says the ticket purchase is the only step anybody writes a forum post about.</desc>
<g fill="none" stroke-linecap="round" font-family="inherit">
<text x="200" y="18" font-size="15.5" font-weight="600" text-anchor="middle" fill="var(--text)" stroke="none">Traveller</text>
<text x="530" y="18" font-size="15.5" font-weight="600" text-anchor="middle" fill="var(--text)" stroke="none">Operator</text>
<line x1="200" y1="84" x2="200" y2="167" stroke="var(--border-strong)" stroke-width="2"/>
<path d="M 195 90 L 200 84 L 205 90" stroke="var(--border-strong)" stroke-width="2"/>
<text x="210" y="130" font-size="12" fill="var(--muted)" stroke="none">in order to</text>
<line x1="200" y1="194" x2="200" y2="297" stroke="var(--border-strong)" stroke-width="2"/>
<path d="M 195 200 L 200 194 L 205 200" stroke="var(--border-strong)" stroke-width="2"/>
<text x="210" y="250" font-size="12" fill="var(--muted)" stroke="none">in order to</text>
<circle cx="200" cy="70" r="9" fill="var(--bg)" stroke="var(--text)" stroke-width="2"/>
<text x="182" y="74" font-size="13" text-anchor="end" fill="var(--muted)" stroke="none">Manage without a car</text>
<circle cx="200" cy="180" r="9" fill="var(--bg)" stroke="var(--text)" stroke-width="2"/>
<text x="182" y="184" font-size="13" text-anchor="end" fill="var(--muted)" stroke="none">Get to work on time</text>
<circle cx="200" cy="310" r="9" fill="var(--mark)" stroke="var(--text)" stroke-width="2"/>
<text x="182" y="314" font-size="13" text-anchor="end" fill="var(--text)" font-weight="600" stroke="none">Buy the right ticket, now</text>
<line x1="530" y1="64" x2="530" y2="137" stroke="var(--border-strong)" stroke-width="2"/>
<path d="M 525 70 L 530 64 L 535 70" stroke="var(--border-strong)" stroke-width="2"/>
<text x="520" y="105" font-size="12" text-anchor="end" fill="var(--muted)" stroke="none">in order to</text>
<line x1="530" y1="164" x2="530" y2="237" stroke="var(--border-strong)" stroke-width="2"/>
<path d="M 525 170 L 530 164 L 535 170" stroke="var(--border-strong)" stroke-width="2"/>
<text x="520" y="205" font-size="12" text-anchor="end" fill="var(--muted)" stroke="none">in order to</text>
<circle cx="530" cy="50" r="9" fill="var(--bg)" stroke="var(--text)" stroke-width="2"/>
<text x="548" y="54" font-size="13" fill="var(--muted)" stroke="none">Pay for the network</text>
<circle cx="530" cy="150" r="9" fill="var(--bg)" stroke="var(--mark)" stroke-width="3"/>
<text x="548" y="154" font-size="13" fill="var(--text)" font-weight="600" stroke="none">Set the fare zones</text>
<circle cx="530" cy="250" r="9" fill="var(--bg)" stroke="var(--text)" stroke-width="2"/>
<text x="548" y="254" font-size="13" fill="var(--muted)" stroke="none">Staff the counter</text>
<path d="M 518 156 L 212 305" stroke="var(--mark)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="452" y="160" font-size="12.5" text-anchor="middle" fill="var(--text)" stroke="none">caused here</text>
<text x="222" y="334" font-size="12.5" fill="var(--text)" stroke="none">felt here</text>
<text x="200" y="358" font-size="12.5" text-anchor="middle" fill="var(--muted)" stroke="none">the only step anybody writes a forum post about</text>
</g>
</svg>
