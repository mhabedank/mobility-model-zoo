name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gate rule 8 looks up recipe commits in the full history
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # torch comes from the CPU-only index on Linux (pyproject [tool.uv.sources])
      - run: uv sync --all-extras
      - run: uv run ruff check
      - run: uv run pytest -q
      - run: uv run zoo validate --all
