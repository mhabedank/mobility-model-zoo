name: ci

# Pull requests run only what their changes need (scripts/ci/select_tests.py): the checks job always,
# the tests of the touched areas, torch only for the JTBD tests, the firmware jobs only for edge
# changes. Pushes to main and manual runs run everything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; on main every commit is tested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      torch: ${{ steps.select.outputs.torch }}
      edge: ${{ steps.select.outputs.edge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # the pull request merge commit and its base
      - id: select
        run: |
          # On a pull request HEAD is the merge commit; its first parent is the base branch.
          if [ "${{ github.event_name }}" = "pull_request" ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
            python3 scripts/ci/select_tests.py --diff HEAD^1 HEAD >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/select_tests.py --all >> "$GITHUB_OUTPUT"
          fi

  # Every pull request: lint, repository-wide tests, registry validation and the compliance harness.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_NO_SYNC: "1"  # uv run would otherwise install torch, a base dependency
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gate rule 8 looks up recipe commits in the full history
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra jtbd --extra release --extra edge --no-install-package torch
      - run: uv run ruff check
      - run: uv run pytest -q $(python3 scripts/ci/select_tests.py --guards)
      - run: uv run zoo validate --all
      # Compliance harness (feature 006): register, notices, drift, REUSE, repository hygiene and the
      # secret scan (C-G3 needs gitleaks).
      - name: install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - run: uv run zoo compliance check --ci

  test:
    needs: changes
    if: needs.changes.outputs.tests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTS: ${{ needs.changes.outputs.tests }}
      TORCH: ${{ needs.changes.outputs.torch }}
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gate rule 8 looks up recipe commits in the full history
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # torch comes from the CPU-only index on Linux (pyproject [tool.uv.sources]) and is installed
      # only when JTBD tests are selected. No TensorFlow (edge-train) and no PlatformIO (edge-hw)
      # here; labeling-api keeps the Anthropic backend unit tests running.
      - run: |
          skip=""
          [ "$TORCH" = "true" ] || skip="--no-install-package torch"
          uv sync --extra jtbd --extra release --extra edge --extra labeling-api $skip
      - run: uv run pytest -q $TESTS

  # HIL suite against the native firmware simulator (no hardware, no PlatformIO).
  edge-sim:
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra edge --no-install-package torch
      - run: uv run edge build -t native
      - run: uv run pytest tests/edge/hil -m hil --hil-board sim -q

  # Real ESP32 firmware running in Espressif's QEMU (hil/qemu-boards.yaml). ESP32-S3/-C3 need
  # ESP-IDF >= 5 to boot in QEMU; the Arduino 2.x core (IDF 4.4) asserts there, so only esp32.
  edge-qemu:
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_NO_SYNC: "1"
      QEMU_RELEASE: esp-develop-9.2.2-20250817
      QEMU_VERSION: esp_develop_9.2.2_20250817
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-esp32-${{ hashFiles('firmware/bench/platformio.ini') }}
          restore-keys: pio-esp32-
      - name: QEMU cache
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: ~/qemu
          key: qemu-xtensa-${{ env.QEMU_RELEASE }}
      - name: Espressif QEMU
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libslirp0 libsdl2-2.0-0 libpixman-1-0
          if [ "${{ steps.qemu-cache.outputs.cache-hit }}" != "true" ]; then
            curl -sSfL "https://github.com/espressif/qemu/releases/download/$QEMU_RELEASE/qemu-xtensa-softmmu-$QEMU_VERSION-x86_64-linux-gnu.tar.xz" \
              | tar xJ -C "$HOME"
          fi
          echo "$HOME/qemu/bin" >> "$GITHUB_PATH"
      - run: uv sync --extra edge --extra edge-hw --no-install-package torch
      - run: uv run edge build -t esp32
      - name: HIL suite on the emulated board
        run: |
          uv run edge --boards hil/qemu-boards.yaml run -b esp32-qemu --quick --no-build --require-all \
            --results results/esp32-qemu --junit results/esp32-qemu/junit.xml
      - name: diagnostics
        if: failure()
        run: |
          for f in build/fw/*/qemu.log results/*/logs/*.log; do
            [ -f "$f" ] || continue
            echo "=== $f"; tail -n 60 "$f" | cut -c1-300
          done
      - name: stop QEMU
        if: always()
        run: uv run python -m mobility_model_zoo.edge.bench.qemu stop --port 5555 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-esp32-qemu
          path: |
            results/
            build/fw/*/qemu.log
          if-no-files-found: ignore
