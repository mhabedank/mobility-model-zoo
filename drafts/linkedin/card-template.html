<!DOCTYPE html><html><head><meta charset="utf-8"><title>{{TITLE}}</title><style>
/* Field note social card. Night print of the screenprint identity (feature 023):
   the same inks as the site, the paper turned over. The warm accent stays rare,
   so it keeps meaning "this matters" — here only the question mark and the wordmark. */
:root{
  --bg:#041C33;        /* night print ground */
  --text:#EDF3EF;
  --muted:#A3B5AD;
  --accent:#ED9B20;    /* poster orange, the same ink as the vehicles in the imagery */
}
@font-face{font-family:Archivo;src:url("{{FONT}}") format("woff2");
  font-weight:400 800;font-stretch:78% 100%;font-style:normal}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:1200px;background:var(--bg);font-family:Archivo,sans-serif;
  position:relative;overflow:hidden}
img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:{{FOCAL}}}
/* The scrim carries the type without covering the picture: opaque only where the words are. */
.scrim{position:absolute;inset:0;background:linear-gradient(to top,
  rgba(4,28,51,.97) 0%, rgba(4,28,51,.93) 30%, rgba(4,28,51,.55) 50%,
  rgba(4,28,51,.12) 68%, rgba(4,28,51,0) 100%)}
.t{position:absolute;left:76px;right:76px;bottom:64px;color:var(--text)}
/* Same settings as .h-display on the site: narrow width axis, weight 700. */
h1{font-size:96px;line-height:.98;letter-spacing:-.025em;font-weight:700;font-stretch:80%}
h1 em{font-style:normal;color:var(--accent)}
p{font-size:31px;line-height:1.3;color:var(--muted);margin-top:26px;max-width:24ch;font-stretch:92%}
.foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:40px;
  font-size:21px;color:var(--muted);border-top:1px solid rgba(237,243,239,.2);
  padding-top:20px;font-stretch:92%}
.foot b{color:var(--accent);font-weight:700}
/* Top layout: headline in the calm sky, ink on paper instead of a dark scrim;
   only the foot stays on a short dark fade at the bottom. */
.top .scrim{background:linear-gradient(to bottom,
  rgba(237,243,239,.72) 0%, rgba(237,243,239,.5) 18%, rgba(237,243,239,0) 34%),
  linear-gradient(to top, rgba(4,28,51,.9) 0%, rgba(4,28,51,.55) 9%, rgba(4,28,51,0) 18%)}
.top .t{position:static}
.top .head{position:absolute;left:76px;right:76px;top:60px;color:var(--bg)}
.top .head p{color:#2E4A5E;max-width:34ch;margin-top:20px}
.top .head h1 em{color:#C46F00}
.top .foot{position:absolute;left:76px;right:76px;bottom:52px;margin-top:0}
</style></head><body class="{{LAYOUT}}">
<img src="{{IMAGE}}"><div class="scrim"></div>
<div class="t">
<div class="head"><h1>{{TITLE}}</h1>
<p>{{SUB}}</p></div>
<div class="foot"><span>{{FOOT}}</span><span><b>mobility model zoo</b></span></div>
</div></body></html>
