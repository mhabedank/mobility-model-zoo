# Provisional usage decision of a catalog entry (research R5, FR-011). First matching rule wins.
# The binding decision is made when the source record is created at fetch time (feature 006).
version: 3
changelog:
- {date: "2026-10-11", change: rules U1-U6, reason: feature 009 research R5}
- {date: "2026-10-11", change: "U3 skips list entries with non_commercial or trains: false", reason: licence list format of feature 011}
- {date: "2026-10-13", change: "U3 admits listed non-commercial licences (usage.non_commercial); U4 keeps ND and unlisted NC", reason: "owner decision D-catalog-nc-training-2026-10 (feature 011: NC inputs train NC models)"}
- {date: "2026-10-14", change: "U2 also covers licences K5 found unconfirmed or contradicted", reason: "audit 2026-10-14; owner decision D-catalog-openalex-evidence-2026-10"}
rules:
  U0: Owner decision for a flagged entry (zoo catalog decide); U1 still overrides it.
  U1: Withdrawn, an opt-out signal, or platform terms that forbid machine learning -> not_usable.
  U2: Licence unknown, or mixed at collection level, or check K5 found it unconfirmed or contradicted
    (flags licence_unconfirmed, licence_conflict) -> undetermined.
  U3: Licence on compliance/lists/licence-allowlist.yaml and not trains false -> training_allowed,
    redistribution allowed; share_alike and non_commercial carried as flags (an NC entry trains
    non-commercial models only, feature 011).
  U4: No-derivatives (ND) licence, or a non-commercial (NC) licence not on the list -> benchmark_only.
  U5: Proprietary licence from a kind of source whose source class records a legal basis -> the class decision.
  U6: Anything else -> undetermined, flagged for an owner decision.
proprietary_ids: [LicenseRef-proprietary, LicenseRef-all-rights-reserved]
# U5: publisher kind -> source class of a topic register and the permitted use decided for it.
source_class_map:
  parliament:
    topic: productdev
    class: parliamentary-records
    permitted_use: benchmark_only
    note: Text and data mining of public parliamentary records under the class's legitimate-interest
      assessment; training on proprietary records needs an owner decision (zoo catalog decide).
