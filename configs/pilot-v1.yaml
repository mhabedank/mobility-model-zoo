# Pilot configuration. Paths are relative to `root` (relative to this file).
root: ..
benchmark_version: pilot-v1
test_fixture: false

paths:
  guideline: guideline/guideline-v1.md
  examples: guideline/examples
  domain: configs/domain/mobility.yaml
  models: configs/models.yaml
  criteria: configs/decision-criteria.yaml
  teacher_scoring: configs/teacher-scoring.yaml
  budget: configs/budget.yaml
  data: data
  benchmarks: benchmarks
  reports: reports

pilot:
  # Composition targets (spec FR-002 to FR-007, FR-002a)
  composition:
    main_size: [140, 160]
    holdout_size: [25, 35]
    sub_area_share_of_relevant: [0.15, 0.25]
    source_type_share: [0.18, 0.32]
    irrelevant_or_near_miss_share: [0.15, 0.25]
    non_eu_share: [0.10, 0.15]
    dach_largest_region: true
    language_min_share: 0.35
    token_range: [300, 1500]
  # Documented source-type substitutions (research.md R2)
  substitutions:
    - {source_type: reddit, replaced_by: forum_review, explanation: "Reddit dropped for pilot-v1 by project decision on 2026-09-29 (no Reddit for Researchers application); user voices come from forums and reviews whose terms allow text and data mining."}
  holdout_size: 30
  # Matching and statistics (research.md R4, R5)
  min_iou: 0.3
  bootstrap_resamples: 1000
  bootstrap_seed: 20260925
  underpowered_min_units: 30
  # Labeling
  max_retries: 2
  max_output_tokens: 4096
  assumed_output_tokens: 1500
  consistency_rules: [irrelevant_no_items, enum_values, quantified_has_quantity]
  redaction_patterns_version: redact-v2
