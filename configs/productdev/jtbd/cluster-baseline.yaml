# Stage settings of the training-free baseline (feature 009, research R5-R9, task T007).
# Thresholds are starting values; `jtbd cluster tune --split dev` replaces them (T032, T043, T044).
# A real encoder or NLI model is loaded only with a pinned revision and a recorded licence basis
# (T008); until then the stage refuses to load it.
# Usage class: non-commercial. e5 was fine-tuned on MS MARCO and Quora (non-commercial terms).
name: cluster-baseline
encoder:
  model_id: intfloat/multilingual-e5-base
  revision: d128750597153bb5987e10b1c3493a34e5a4502a  # pinned 2026-10-10 with topics/productdev/scripts/cluster/pin_revisions.py (T008)
  licence_basis: "MIT (model card licence tag, checked 2026-10-09; the repository has no LICENSE file, rechecked 2026-10-10 when pinning)"
  prefix: "query: "
  trust_remote_code: false
  pooling: mean
  normalize: true
  batch_size: 64
  max_length: 128
# No NLI model (2026-10-11): its training data includes LingNLI and multilingual-NLI-26lang-2mil7,
# which state no licence, so not even a non-commercial release can use it; cluster-gte-base-nli
# measures what the specificity relation would add. e5 itself stays non-commercial (MS MARCO, Quora).
nli: null
neighbours:
  k: 30
  candidate_floor: 0.50
  k_spec: 5          # specificity candidates per group (NLI cost; research R8, note of 2026-10-11)
thresholds:
  t_dup: 0.88
  t_spec: 0.75
  t_nli: 0.80
levels: [0.70, 0.55]
representative: medoid
settings_changes: []
