# Second encoder candidate of the training-free baseline (feature 009, research R5, task T007).
# Thresholds are starting values; `jtbd cluster tune --split dev` replaces them (T032, T043, T044).
# A real encoder or NLI model is loaded only with a pinned revision and a recorded licence basis
# (T008); until then the stage refuses to load it.
name: cluster-e5-small
encoder:
  model_id: intfloat/multilingual-e5-small
  revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3  # pinned 2026-10-10 with topics/productdev/scripts/cluster/pin_revisions.py (T008)
  licence_basis: "MIT (model card licence tag, checked 2026-10-09; the repository has no LICENSE file, rechecked 2026-10-10 when pinning)"
  prefix: "query: "
  trust_remote_code: false
  pooling: mean
  normalize: true
  batch_size: 64
  max_length: 128
nli:
  model_id: MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7
  revision: b5113eb38ab63efdd7f280f8c144ea8b13f978ce
  # Open (T008): the model itself is MIT, but its training data multilingual-NLI-26lang-2mil7
  # includes ANLI subsets, whose licence must be checked for commercial use before this model is
  # used. Owner decision; until then the stage refuses to load it.
  licence_basis: null
neighbours:
  k: 30
  candidate_floor: 0.50
thresholds:
  t_dup: 0.88
  t_spec: 0.75
  t_nli: 0.80
levels: [0.70, 0.55]
representative: medoid
settings_changes: []
